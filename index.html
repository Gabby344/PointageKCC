<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCC | Portail de Pointage</title>
    <style>
        :root { --kcc-blue: #003366; --kcc-yellow: #ffcc00; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 120px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--kcc-blue); color: white; }
        #nom-display { font-weight: bold; color: var(--kcc-blue); display: block; margin: 10px 0; }
        #admin-panel { display: none; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="logokcc.jpeg" class="logo">
        <div id="login-form">
            <input type="email" id="email" placeholder="Email Admin">
            <input type="password" id="password" placeholder="Mot de passe">
            <button class="btn-primary" onclick="login()">Se connecter</button>
        </div>
        <div id="pointage-form" style="display:none;">
            <input type="text" id="matricule" placeholder="Matricule" oninput="trouverNom()">
            <span id="nom-display"></span>
            <select id="lieu">
                <option value="">Choisir lieu</option>
                <option value="Bâtiments la Vision">Bâtiments la Vision</option>
                <option value="Hôtel Moon Palace">Hôtel Moon Palace</option>
                <option value="Hotel Kolwezi Lodge">Hotel Kolwezi Lodge</option>
                <option value="Direction KCC avenue Lusanga">Direction KCC avenue Lusanga</option>
            </select>
            <button class="btn-primary" onclick="pointer('Arrivée')">Enregistrer Arrivée</button>
            <video id="video" autoplay playsinline style="display:none; width:100%"></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <button onclick="logout()" style="background:#666; color:white;">Déconnexion</button>
        </div>
        <button class="btn-primary" onclick="toggleAdmin()">Accès Admin</button>
        <div id="admin-panel">
            <h3>Historique Admin</h3>
            <table id="table-pointages" border="1" style="width:100%; font-size:12px;"></table>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
