<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KCC Pointage - Système de Gestion des Présences</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fc;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
        }

        /* Main Card */
        .card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0a2540 0%, #1a3a5c 100%);
            padding: 28px 24px;
            text-align: center;
            position: relative;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo-wrapper {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header h1 {
            color: white;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .header-sub {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 400;
        }

        /* Content */
        .content {
            padding: 28px 24px;
        }

        /* Timer */
        .timer-section {
            background: #f8f9fc;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid #eef2f6;
        }

        .timer-label {
            font-size: 13px;
            font-weight: 500;
            color: #6c7a8a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .timer {
            font-size: 44px;
            font-weight: 600;
            font-family: 'Inter', 'Courier New', monospace;
            color: #0a2540;
            letter-spacing: 2px;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1e2a3e;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: #ffffff;
            color: #1e2a3e;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1a3a5c;
            box-shadow: 0 0 0 3px rgba(26, 58, 92, 0.1);
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* Employee Card */
        .employee-card {
            background: linear-gradient(135deg, #0a2540 0%, #1a3a5c 100%);
            border-radius: 20px;
            padding: 16px 20px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .employee-avatar {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 500;
            color: white;
        }

        .employee-info {
            flex: 1;
        }

        .employee-name {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .employee-id {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: 500;
        }

        .error-card {
            background: #fee2e2;
            border-radius: 20px;
            padding: 16px 20px;
            color: #c53030;
            font-weight: 500;
            font-size: 14px;
            text-align: center;
        }

        /* GPS Box */
        .gps-box {
            background: #f8f9fc;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #eef2f6;
        }

        .gps-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-inactive {
            background: #ffebee;
            color: #c62828;
        }

        .status-warning {
            background: #fff3e0;
            color: #e65100;
        }

        .gps-coords {
            font-size: 12px;
            color: #6c7a8a;
            font-family: monospace;
            margin-top: 8px;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            color: #1a3a5c;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* Camera Section */
        .camera-section {
            background: #f8f9fc;
            border-radius: 20px;
            padding: 16px;
        }

        video, .photo-preview-img {
            width: 100%;
            border-radius: 16px;
            margin-top: 12px;
            background: #e2e8f0;
        }

        video {
            transform: scaleX(-1);
        }

        .photo-preview {
            margin-top: 12px;
        }

        .photo-preview-img {
            width: 100%;
            border-radius: 16px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            margin: 24px 0 16px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0a2540 0%, #1a3a5c 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(10, 37, 64, 0.3);
        }

        .btn-arrival {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
        }

        .btn-departure {
            background: linear-gradient(135deg, #e65100 0%, #bf360c 100%);
            color: white;
        }

        .btn-reset {
            background: #ffffff;
            color: #6c7a8a;
            border: 1.5px solid #e2e8f0;
            margin-top: 8px;
        }

        .btn-reset:hover {
            background: #fee2e2;
            border-color: #fecaca;
            color: #c62828;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Admin Link */
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }

        .btn-admin {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 16px;
            transition: color 0.2s ease;
        }

        .btn-admin:hover {
            color: #1a3a5c;
        }

        /* Toast Message */
        .toast-message {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 24px;
            border-radius: 60px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            z-index: 10000;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }
            .content {
                padding: 20px 16px;
            }
            .timer {
                font-size: 36px;
            }
            .btn {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-container">
                    <div class="logo-wrapper">
                        <img src="logokcc.jpeg" alt="KCC Logo" class="logo-img" onerror="this.src='https://placehold.co/80x80/0a2540/white?text=KCC'">
                    </div>
                </div>
                <h1>KCC Pointage</h1>
                <div class="header-sub">Système de gestion des présences</div>
            </div>

            <div class="content">
                <div class="timer-section">
                    <div class="timer-label">Heure actuelle</div>
                    <div class="timer" id="timer">--:--:--</div>
                </div>

                <div class="form-group">
                    <label>Matricule employé</label>
                    <input type="text" id="matricule" placeholder="Ex: S13001" autocomplete="off">
                    <div id="employeeInfo"></div>
                </div>

                <div class="form-group">
                    <label>Lieu de travail</label>
                    <select id="lieu">
                        <option value="">Sélectionner un site</option>
                        <option value="Batiments_la_Vision">Batiments la Vision</option>
                        <option value="Hotel_Moon_Palace">Hotel Moon Palace</option>
                        <option value="Hotel_Kolwezi_Lodge">Hotel Kolwezi Lodge</option>
                        <option value="Direction_KCC">Direction KCC</option>
                    </select>
                </div>

                <div class="gps-box">
                    <div class="gps-status">
                        <span>Localisation GPS</span>
                        <span id="gpsStatus" class="status-badge status-inactive">Non activé</span>
                    </div>
                    <div id="gpsCoords" class="gps-coords"></div>
                    <button id="btnGps" class="btn-secondary">Activer la géolocalisation</button>
                </div>

                <div class="camera-section">
                    <label style="margin-bottom: 8px;">Capture photo</label>
                    <video id="video" autoplay playsinline style="display: none;"></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <div id="photoPreview"></div>
                    <button id="btnCamera" class="btn-secondary" style="margin-top: 0;">Activer la caméra</button>
                    <button id="btnPhoto" class="btn-secondary" disabled>Prendre la photo</button>
                </div>

                <div class="btn-group">
                    <button id="btnArrivee" class="btn btn-arrival" disabled>Arrivée</button>
                    <button id="btnDepart" class="btn btn-departure" disabled>Départ</button>
                </div>
                
                <button id="btnReset" class="btn btn-reset">Réinitialiser le formulaire</button>
            </div>
        </div>

        <div class="admin-link">
            <button id="btnAdmin" class="btn-admin">Accès administration</button>
        </div>
    </div>

    <script type="module">
        import { auth, db, storage, employes, sites } from './firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { collection, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

        let currentEmployee = null;
        let currentPhoto = null;
        let currentLocation = null;
        let videoStream = null;
        let gpsOk = false;
        let photoOk = false;

        const matriculeInput = document.getElementById('matricule');
        const employeeInfo = document.getElementById('employeeInfo');
        const lieuSelect = document.getElementById('lieu');
        const gpsStatus = document.getElementById('gpsStatus');
        const gpsCoords = document.getElementById('gpsCoords');
        const btnGps = document.getElementById('btnGps');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photoPreview');
        const btnCamera = document.getElementById('btnCamera');
        const btnPhoto = document.getElementById('btnPhoto');
        const btnArrivee = document.getElementById('btnArrivee');
        const btnDepart = document.getElementById('btnDepart');
        const btnReset = document.getElementById('btnReset');
        const btnAdmin = document.getElementById('btnAdmin');

        function updateTimer() {
            document.getElementById('timer').textContent = new Date().toLocaleTimeString('fr-FR');
        }
        updateTimer();
        setInterval(updateTimer, 1000);

        function showMessage(msg, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.style.backgroundColor = isError ? '#c62828' : '#2e7d32';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function checkReady() {
            const lieuOk = lieuSelect.value !== "";
            const ready = (currentEmployee && photoOk && gpsOk && lieuOk);
            btnArrivee.disabled = !ready;
            btnDepart.disabled = !ready;
        }

        matriculeInput.addEventListener('input', function() {
            const mat = this.value.trim().toUpperCase();
            if (employes[mat]) {
                currentEmployee = { matricule: mat, name: employes[mat] };
                const initial = currentEmployee.name.charAt(0).toUpperCase();
                employeeInfo.innerHTML = `
                    <div class="employee-card">
                        <div class="employee-avatar">${initial}</div>
                        <div class="employee-info">
                            <div class="employee-name">${currentEmployee.name}</div>
                            <div class="employee-id">${currentEmployee.matricule}</div>
                        </div>
                    </div>
                `;
                showMessage(`Bienvenue ${currentEmployee.name}`);
            } else if (mat.length >= 3) {
                currentEmployee = null;
                employeeInfo.innerHTML = '<div class="error-card">Matricule non reconnu</div>';
            } else {
                currentEmployee = null;
                employeeInfo.innerHTML = '';
            }
            checkReady();
        });

        function calculerDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        btnGps.addEventListener('click', () => {
            if (!navigator.geolocation) {
                showMessage("Géolocalisation non supportée", true);
                return;
            }
            gpsStatus.textContent = "Recherche...";
            gpsStatus.className = "status-badge status-warning";
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    gpsStatus.textContent = "GPS actif";
                    gpsStatus.className = "status-badge status-active";
                    gpsCoords.innerHTML = `${currentLocation.lat.toFixed(4)}°, ${currentLocation.lng.toFixed(4)}°`;
                    
                    if (lieuSelect.value) {
                        const site = sites[lieuSelect.value];
                        if (site) {
                            const distance = calculerDistance(currentLocation.lat, currentLocation.lng, site.lat, site.lng);
                            if (distance <= site.radius) {
                                gpsOk = true;
                                gpsStatus.textContent = "Dans la zone";
                                showMessage(`Vous êtes dans la zone (${Math.round(distance)}m)`);
                            } else {
                                gpsOk = false;
                                gpsStatus.textContent = "Hors zone";
                                gpsStatus.className = "status-badge status-inactive";
                                showMessage(`Distance: ${Math.round(distance)}m du site`, true);
                            }
                        }
                    } else {
                        gpsOk = true;
                    }
                    checkReady();
                },
                (err) => {
                    gpsOk = false;
                    gpsStatus.textContent = "GPS refusé";
                    gpsStatus.className = "status-badge status-inactive";
                    showMessage("Veuillez autoriser la géolocalisation", true);
                }
            );
        });

        lieuSelect.addEventListener('change', () => {
            if (currentLocation && lieuSelect.value) {
                const site = sites[lieuSelect.value];
                if (site) {
                    const distance = calculerDistance(currentLocation.lat, currentLocation.lng, site.lat, site.lng);
                    if (distance <= site.radius) {
                        gpsOk = true;
                        gpsStatus.textContent = "Dans la zone";
                        gpsStatus.className = "status-badge status-active";
                    } else {
                        gpsOk = false;
                        gpsStatus.textContent = "Hors zone";
                        gpsStatus.className = "status-badge status-inactive";
                    }
                }
            }
            checkReady();
        });

        btnCamera.addEventListener('click', async () => {
            try {
                if (videoStream) videoStream.getTracks().forEach(t => t.stop());
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = videoStream;
                video.style.display = "block";
                btnPhoto.disabled = false;
                btnCamera.textContent = "Caméra active";
                showMessage("Caméra prête");
            } catch (err) {
                showMessage("Impossible d'accéder à la caméra", true);
            }
        });

        btnPhoto.addEventListener('click', () => {
            if (!videoStream) {
                showMessage("Activez d'abord la caméra", true);
                return;
            }
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            ctx.restore();
            
            currentPhoto = canvas.toDataURL('image/jpeg', 0.8);
            const img = document.createElement('img');
            img.src = currentPhoto;
            img.className = "photo-preview-img";
            photoPreview.innerHTML = "";
            photoPreview.appendChild(img);
            
            photoOk = true;
            btnPhoto.disabled = true;
            btnPhoto.textContent = "Photo prise";
            
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
                video.style.display = "none";
            }
            showMessage("Photo enregistrée");
            checkReady();
        });

        async function savePointage(type) {
            if (!currentEmployee || !photoOk || !gpsOk || !lieuSelect.value) {
                showMessage("Veuillez compléter tous les champs", true);
                return;
            }
            
            btnArrivee.disabled = true;
            btnDepart.disabled = true;
            
            try {
                const siteName = lieuSelect.options[lieuSelect.selectedIndex].text;
                const photoRef = ref(storage, `pointages/${Date.now()}_${currentEmployee.matricule}.jpg`);
                await uploadString(photoRef, currentPhoto, 'data_url');
                const photoURL = await getDownloadURL(photoRef);
                
                await addDoc(collection(db, "pointages"), {
                    matricule: currentEmployee.matricule,
                    nom: currentEmployee.name,
                    lieu: lieuSelect.value,
                    lieuName: siteName,
                    type: type,
                    photoURL: photoURL,
                    location: currentLocation,
                    timestamp: Timestamp.now(),
                    date: new Date().toISOString().split('T')[0],
                    heure: new Date().toLocaleTimeString('fr-FR')
                });
                
                showMessage(`${type} enregistrée à ${new Date().toLocaleTimeString('fr-FR')}`);
                resetAll();
            } catch (error) {
                console.error(error);
                showMessage("Erreur d'enregistrement", true);
                btnArrivee.disabled = false;
                btnDepart.disabled = false;
            }
        }

        btnArrivee.addEventListener('click', () => savePointage("Arrivée"));
        btnDepart.addEventListener('click', () => savePointage("Départ"));

        function resetAll() {
            currentEmployee = null;
            currentPhoto = null;
            currentLocation = null;
            photoOk = false;
            gpsOk = false;
            matriculeInput.value = "";
            lieuSelect.value = "";
            employeeInfo.innerHTML = "";
            gpsStatus.textContent = "Non activé";
            gpsStatus.className = "status-badge status-inactive";
            gpsCoords.innerHTML = "";
            photoPreview.innerHTML = "";
            btnCamera.textContent = "Activer la caméra";
            btnPhoto.disabled = true;
            btnPhoto.textContent = "Prendre la photo";
            video.style.display = "none";
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            checkReady();
            showMessage("Formulaire réinitialisé");
        }

        btnReset.addEventListener('click', resetAll);

        btnAdmin.addEventListener('click', () => {
            const email = prompt("Email administrateur:");
            if (!email) return;
            const pwd = prompt("Mot de passe:");
            signInWithEmailAndPassword(auth, email, pwd)
                .then(() => window.location.href = "admin.html")
                .catch(() => showMessage("Identifiants incorrects", true));
        });
    </script>
</body>
</html>
