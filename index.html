<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KCC Pointage | Employé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            padding: 16px;
        }

        /* Conteneur principal centré sur l'employé */
        .employee-container {
            max-width: 550px;
            margin: 0 auto;
        }

        /* Carte principale */
        .pointage-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            margin-bottom: 16px;
        }

        /* En-tête avec logo - discret */
        .card-header {
            padding: 20px 24px 12px 24px;
            text-align: center;
            border-bottom: 1px solid #eef2f6;
        }

        .logo {
            width: 70px;
            height: auto;
            margin-bottom: 8px;
        }

        .card-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1a2c3e;
        }

        .card-header p {
            font-size: 13px;
            color: #6c7a8e;
            margin-top: 4px;
        }

        /* Corps du formulaire */
        .card-body {
            padding: 24px;
        }

        /* Groupe de formulaire */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .required::after {
            content: "*";
            color: #e74c3c;
            margin-left: 4px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            background: white;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2c5f8a;
            box-shadow: 0 0 0 3px rgba(44,95,138,0.1);
        }

        /* Zone d'affichage du nom */
        .employee-name-card {
            background: #eef2fa;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            margin: 16px 0;
            display: none;
        }

        .employee-name-card.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .employee-avatar {
            width: 60px;
            height: 60px;
            background: #2c5f8a;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .employee-avatar span {
            font-size: 28px;
            color: white;
        }

        .employee-name-card h3 {
            font-size: 18px;
            color: #1a2c3e;
            margin-bottom: 4px;
        }

        .employee-name-card p {
            font-size: 13px;
            color: #6c7a8e;
        }

        /* Zone GPS */
        .gps-status {
            background: #f8f9fc;
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #eef2f6;
        }

        .gps-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #cbd5e1;
            transition: all 0.3s;
        }

        .gps-dot.active {
            background: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.2);
        }

        .gps-dot.error {
            background: #ef4444;
        }

        .gps-text {
            flex: 1;
            font-size: 14px;
            color: #4a5568;
        }

        .gps-coords {
            font-size: 11px;
            color: #94a3b8;
            font-family: monospace;
        }

        /* Zone photo */
        .photo-zone {
            background: #f8f9fc;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px dashed #cbd5e1;
            transition: all 0.2s;
        }

        .photo-zone.has-photo {
            border-color: #10b981;
            background: #f0fdf4;
        }

        .camera-preview {
            position: relative;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            background: #1a1a2e;
        }

        .camera-preview video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }

        .captured-photo {
            width: 100%;
            border-radius: 16px;
            margin-top: 12px;
        }

        .btn-camera {
            background: #2c5f8a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-camera:hover {
            background: #1e3a5f;
        }

        .btn-retake {
            background: #6c7a8e;
            margin-left: 8px;
        }

        .photo-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 12px;
        }

        /* Boutons action */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-arrival {
            background: #10b981;
            color: white;
        }

        .btn-arrival:disabled {
            background: #a7f3d0;
            cursor: not-allowed;
        }

        .btn-departure {
            background: #f59e0b;
            color: white;
        }

        .btn-departure:disabled {
            background: #fde68a;
            cursor: not-allowed;
        }

        .btn-logout {
            background: #eef2f6;
            color: #6c7a8e;
            margin-top: 12px;
        }

        /* Bouton admin discret */
        .admin-link {
            text-align: center;
            margin-top: 12px;
        }

        .admin-btn {
            background: transparent;
            border: none;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .admin-btn:hover {
            background: #eef2f6;
            color: #2c5f8a;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 32px;
            padding: 32px 24px;
            max-width: 320px;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        .modal-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-message {
            color: #6c7a8e;
            margin-bottom: 24px;
        }

        .modal-btn {
            background: #2c5f8a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .card-body {
                padding: 20px;
            }
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="employee-container">
        <div class="pointage-card">
            <div class="card-header">
                <img src="logokcc.jpeg" alt="KCC" class="logo" onerror="this.style.display='none'">
                <h1>Pointage terrain</h1>
                <p>Enregistrez votre présence sur site</p>
            </div>
            <div class="card-body">
                <!-- Statut GPS -->
                <div class="gps-status" id="gpsStatus">
                    <div class="gps-dot" id="gpsDot"></div>
                    <div class="gps-text">
                        <span id="gpsMessage">Chargement GPS...</span>
                        <div class="gps-coords" id="gpsCoords"></div>
                    </div>
                </div>

                <!-- Matricule -->
                <div class="form-group">
                    <label class="required">Matricule</label>
                    <input type="text" id="matricule" placeholder="Ex: S13001" autocomplete="off">
                </div>

                <!-- Carte d'identité employé -->
                <div class="employee-name-card" id="employeeCard">
                    <div class="employee-avatar">
                        <span>👤</span>
                    </div>
                    <h3 id="employeeFullName"></h3>
                    <p id="employeeMatricule"></p>
                </div>

                <!-- Lieu de travail -->
                <div class="form-group">
                    <label class="required">Lieu de travail</label>
                    <select id="workLocation">
                        <option value="">-- Sélectionnez --</option>
                        <option value="Batiments_la_Vision">🏢 Bâtiments la Vision</option>
                        <option value="Hotel_Moon_Palace">🏨 Hôtel Moon Palace</option>
                        <option value="Hotel_Kolwezi_Lodge">🏨 Hotel Kolwezi Lodge</option>
                        <option value="Direction_KCC">🏢 Direction KCC - Lusanga</option>
                    </select>
                </div>

                <!-- Zone photo selfie -->
                <div class="photo-zone" id="photoZone">
                    <div style="margin-bottom: 8px;">📸 Photo de contrôle</div>
                    <div class="camera-preview" id="cameraContainer" style="display: none;">
                        <video id="video" autoplay playsinline></video>
                    </div>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <div id="photoPreview"></div>
                    <button class="btn-camera" id="takePhotoBtn" style="display: none;">📷 Prendre la photo</button>
                    <div class="photo-hint">La photo sera utilisée comme preuve de présence</div>
                </div>

                <!-- Boutons action -->
                <div class="action-buttons">
                    <button class="btn btn-arrival" id="arrivalBtn" disabled>✅ Arrivée</button>
                    <button class="btn btn-departure" id="departureBtn" disabled>❌ Départ</button>
                </div>

                <button class="btn btn-logout" id="logoutBtn">Se déconnecter</button>
            </div>
        </div>

        <!-- Bouton admin discret -->
        <div class="admin-link">
            <button class="admin-btn" id="adminBtn">⚙️ Administration</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">✓</div>
            <div class="modal-title" id="modalTitle">Succès</div>
            <div class="modal-message" id="modalMessage">Opération réussie</div>
            <button class="modal-btn" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDoc, doc, setDoc, Timestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkCnxIDdzngjnltxC9IBCV1Fk2JYSrKM0",
            authDomain: "pointage-app-42339.firebaseapp.com",
            projectId: "pointage-app-42339",
            storageBucket: "pointage-app-42339.firebasestorage.app",
            appId: "1:63257821944:web:e8e06472eacee7675eb10d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const validLocations = {
            "Batiments_la_Vision": { lat: -10.7167, lng: 25.4667, radius: 500, name: "Bâtiments la Vision" },
            "Hotel_Moon_Palace": { lat: -11.6614, lng: 27.4828, radius: 500, name: "Hôtel Moon Palace" },
            "Hotel_Kolwezi_Lodge": { lat: -10.7167, lng: 25.4667, radius: 500, name: "Hotel Kolwezi Lodge" },
            "Direction_KCC": { lat: -10.7167, lng: 25.4667, radius: 500, name: "Direction KCC" }
        };

        // Initialisation des travailleurs par défaut
        const defaultWorkers = {
            "S13001": "Josué Mulaj",
            "S13002": "Shekinah Mukeni",
            "S13003": "Patrick Kalenga",
            "S13004": "Arnaud Luela",
            "S13005": "Nadine Zola"
        };

        async function initWorkers() {
            for (const [mat, name] of Object.entries(defaultWorkers)) {
                const ref = doc(db, "workers", mat);
                const snap = await getDoc(ref);
                if (!snap.exists()) {
                    await setDoc(ref, { matricule: mat, name, active: true, createdAt: Timestamp.now() });
                }
            }
        }
        initWorkers();

        // Variables
        let currentEmployee = null;
        let currentPhoto = null;
        let currentLocation = null;
        let videoStream = null;
        let isLocationActive = false;

        const matriculeInput = document.getElementById('matricule');
        const employeeCard = document.getElementById('employeeCard');
        const employeeFullName = document.getElementById('employeeFullName');
        const employeeMatriculeSpan = document.getElementById('employeeMatricule');
        const workLocation = document.getElementById('workLocation');
        const arrivalBtn = document.getElementById('arrivalBtn');
        const departureBtn = document.getElementById('departureBtn');
        const takePhotoBtn = document.getElementById('takePhotoBtn');
        const cameraContainer = document.getElementById('cameraContainer');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photoPreview');
        const gpsMessage = document.getElementById('gpsMessage');
        const gpsCoords = document.getElementById('gpsCoords');
        const gpsDot = document.getElementById('gpsDot');

        // Demander la géolocalisation immédiatement
        function getLocation() {
            gpsMessage.textContent = "Activation GPS...";
            gpsDot.className = "gps-dot";
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        };
                        isLocationActive = true;
                        gpsDot.className = "gps-dot active";
                        gpsMessage.textContent = "📍 GPS actif";
                        gpsCoords.textContent = `${currentLocation.lat.toFixed(6)}, ${currentLocation.lng.toFixed(6)} (±${Math.round(currentLocation.accuracy)}m)`;
                        checkReady();
                    },
                    (error) => {
                        isLocationActive = false;
                        gpsDot.className = "gps-dot error";
                        let msg = "Erreur GPS";
                        if (error.code === 1) msg = "Autorisez la géolocalisation";
                        if (error.code === 2) msg = "Position indisponible";
                        if (error.code === 3) msg = "Délai dépassé";
                        gpsMessage.textContent = `❌ ${msg}`;
                        gpsCoords.textContent = "Activez le GPS pour pointer";
                        showModal("⚠️ GPS requis", "Veuillez autoriser la géolocalisation pour pouvoir pointer");
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                gpsMessage.textContent = "❌ GPS non supporté";
                gpsDot.className = "gps-dot error";
            }
        }

        getLocation();

        // Vérifier matricule
        matriculeInput.addEventListener('input', async function() {
            const mat = this.value.trim();
            if (mat.length >= 5) {
                const workerRef = doc(db, "workers", mat);
                const snap = await getDoc(workerRef);
                if (snap.exists()) {
                    currentEmployee = snap.data();
                    employeeFullName.textContent = currentEmployee.name;
                    employeeMatriculeSpan.textContent = currentEmployee.matricule;
                    employeeCard.classList.add('show');
                    startCamera();
                } else {
                    currentEmployee = null;
                    employeeCard.classList.remove('show');
                    stopCamera();
                }
            } else {
                currentEmployee = null;
                employeeCard.classList.remove('show');
                stopCamera();
            }
            checkReady();
        });

        // Démarrer caméra
        async function startCamera() {
            if (videoStream) stopCamera();
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = videoStream;
                cameraContainer.style.display = 'block';
                takePhotoBtn.style.display = 'inline-flex';
            } catch (err) {
                console.error("Camera error:", err);
                showModal("📷 Caméra", "Impossible d'accéder à la caméra");
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            video.srcObject = null;
            cameraContainer.style.display = 'none';
            takePhotoBtn.style.display = 'none';
        }

        // Prendre la photo
        takePhotoBtn.addEventListener('click', function() {
            if (!video.videoWidth) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            ctx.restore();
            
            currentPhoto = canvas.toDataURL('image/jpeg', 0.8);
            
            const img = document.createElement('img');
            img.src = currentPhoto;
            img.style.width = '100%';
            img.style.borderRadius = '16px';
            img.style.marginTop = '12px';
            photoPreview.innerHTML = '';
            photoPreview.appendChild(img);
            
            document.getElementById('photoZone').classList.add('has-photo');
            takePhotoBtn.textContent = '📸 Re-prendre';
            
            stopCamera();
            checkReady();
        });

        // Valider la localisation
        function isLocationValid() {
            if (!currentLocation || !workLocation.value) return false;
            const site = validLocations[workLocation.value];
            if (!site) return false;
            
            const R = 6371e3;
            const φ1 = currentLocation.lat * Math.PI/180;
            const φ2 = site.lat * Math.PI/180;
            const Δφ = (site.lat - currentLocation.lat) * Math.PI/180;
            const Δλ = (site.lng - currentLocation.lng) * Math.PI/180;
            
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;
            
            return distance <= site.radius;
        }

        // Vérifier si tout est prêt
        function checkReady() {
            const hasEmployee = currentEmployee !== null;
            const hasPhoto = currentPhoto !== null;
            const hasLocation = isLocationActive && workLocation.value && isLocationValid();
            
            arrivalBtn.disabled = !(hasEmployee && hasPhoto && hasLocation);
            departureBtn.disabled = !(hasEmployee && hasPhoto && hasLocation);
            
            // Feedback visuel sur la localisation
            if (workLocation.value && currentLocation && !isLocationValid()) {
                gpsMessage.textContent = "⚠️ Vous êtes hors zone autorisée";
                gpsMessage.style.color = "#ef4444";
            } else if (workLocation.value && isLocationValid()) {
                gpsMessage.textContent = "✅ Vous êtes dans la zone autorisée";
                gpsMessage.style.color = "#10b981";
            } else {
                gpsMessage.style.color = "#4a5568";
            }
        }

        workLocation.addEventListener('change', checkReady);

        // Sauvegarder pointage
        async function savePointage(type) {
            if (!isLocationValid()) {
                showModal("📍 Hors zone", "Vous n'êtes pas à l'emplacement autorisé pour ce site");
                return;
            }
            
            arrivalBtn.disabled = true;
            departureBtn.disabled = true;
            
            const loadingMsg = showModal("⏳ Enregistrement", "Veuillez patienter...", false);
            
            try {
                const site = workLocation.value;
                const siteName = workLocation.options[workLocation.selectedIndex].text;
                
                // Upload photo
                const photoRef = ref(storage, `pointages/${Date.now()}_${currentEmployee.matricule}.jpg`);
                await uploadString(photoRef, currentPhoto, 'data_url');
                const photoURL = await getDownloadURL(photoRef);
                
                // Enregistrement
                await addDoc(collection(db, "pointages"), {
                    matricule: currentEmployee.matricule,
                    nom: currentEmployee.name,
                    lieu: site,
                    lieuName: siteName,
                    type: type,
                    photoURL: photoURL,
                    location: currentLocation,
                    timestamp: Timestamp.now(),
                    date: new Date().toISOString().split('T')[0],
                    time: new Date().toLocaleTimeString('fr-FR')
                });
                
                showModal(`✅ ${type} enregistrée`, `${currentEmployee.name} - ${siteName}\n${new Date().toLocaleTimeString('fr-FR')}`);
                
                // Réinitialiser
                resetForm();
                
            } catch (error) {
                console.error(error);
                showModal("❌ Erreur", "Problème de connexion, réessayez");
                arrivalBtn.disabled = false;
                departureBtn.disabled = false;
            }
        }

        function resetForm() {
            currentPhoto = null;
            photoPreview.innerHTML = '';
            document.getElementById('photoZone').classList.remove('has-photo');
            matriculeInput.value = '';
            workLocation.value = '';
            currentEmployee = null;
            employeeCard.classList.remove('show');
            takePhotoBtn.textContent = '📷 Prendre la photo';
            startCamera();
            checkReady();
        }

        arrivalBtn.addEventListener('click', () => savePointage("Arrivée"));
        departureBtn.addEventListener('click', () => savePointage("Départ"));

        // Modal
        function showModal(title, message, autoClose = true) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIcon = document.getElementById('modalIcon');
            
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            if (title.includes("✅")) modalIcon.textContent = "✓";
            else if (title.includes("❌")) modalIcon.textContent = "✗";
            else if (title.includes("⏳")) modalIcon.textContent = "⏳";
            else modalIcon.textContent = "ℹ️";
            
            modal.classList.add('show');
            
            if (autoClose) {
                setTimeout(() => {
                    modal.classList.remove('show');
                }, 2500);
            }
            return modal;
        }
        
        window.closeModal = function() {
            document.getElementById('modal').classList.remove('show');
        };

        // Déconnexion
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            stopCamera();
            resetForm();
            showModal("👋 Déconnecté", "À bientôt");
            setTimeout(() => location.reload(), 1500);
        });

        // Admin discret
        document.getElementById('adminBtn').addEventListener('click', () => {
            const email = prompt("Email administrateur:");
            if (!email) return;
            const password = prompt("Mot de passe:");
            if (!password) return;
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = 'admin.html';
                })
                .catch(() => {
                    showModal("❌ Accès refusé", "Identifiants incorrects");
                });
        });

        console.log("Application KCC prête");
    </script>
</body>
</html>
