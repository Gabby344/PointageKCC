<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCC Pointage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .logo {
            width: 70px;
            height: 70px;
            background: #003366;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 35px;
            margin-bottom: 10px;
        }
        h1 { color: #003366; font-size: 22px; }
        .timer {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #003366;
            margin: 15px 0;
            font-family: monospace;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #003366;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #003366; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-group button { flex: 1; margin-top: 0; }
        .info-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }
        .employee-card {
            background: linear-gradient(135deg, #003366, #0055aa);
            color: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            margin: 15px 0;
        }
        .employee-name { font-size: 18px; font-weight: bold; }
        video { width: 100%; border-radius: 10px; transform: scaleX(-1); margin-top: 10px; }
        .photo-preview { width: 100%; border-radius: 10px; margin-top: 10px; }
        .admin-link { text-align: center; }
        .admin-btn {
            background: transparent;
            color: #999;
            font-size: 11px;
            padding: 5px;
            width: auto;
        }
        .status-success { background: #28a745; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .status-error { background: #dc3545; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .status-warning { background: #ffc107; color: #333; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">⛏️</div>
                <h1>KCC Pointage</h1>
            </div>

            <div class="timer" id="timer">--:--:--</div>

            <div class="form-group">
                <label>📋 Matricule</label>
                <input type="text" id="matricule" placeholder="Ex: S13001" autocomplete="off">
                <div id="employeeInfo"></div>
            </div>

            <div class="form-group">
                <label>📍 Lieu de travail</label>
                <select id="lieu">
                    <option value="">-- Sélectionnez --</option>
                    <option value="Batiments_la_Vision">🏢 Bâtiments la Vision</option>
                    <option value="Hotel_Moon_Palace">🏨 Hôtel Moon Palace</option>
                    <option value="Hotel_Kolwezi_Lodge">🏨 Hotel Kolwezi Lodge</option>
                    <option value="Direction_KCC">🏢 Direction KCC</option>
                </select>
            </div>

            <div class="info-box">
                <div>📍 GPS: <span id="gpsStatus">Non activé</span></div>
                <div id="gpsCoords" style="font-size: 12px; margin-top: 5px;"></div>
                <button id="btnGps" class="btn-info" style="margin-top: 10px;">🔍 Activer GPS</button>
            </div>

            <div class="form-group">
                <label>📸 Photo</label>
                <video id="video" autoplay playsinline style="display: none;"></video>
                <canvas id="canvas" style="display: none;"></canvas>
                <div id="photoPreview"></div>
                <button id="btnCamera" class="btn-info">🎥 Activer caméra</button>
                <button id="btnPhoto" class="btn-primary" style="margin-top: 5px;" disabled>📷 Prendre la photo</button>
            </div>

            <div class="btn-group">
                <button id="btnArrivee" class="btn-success" disabled>✅ ARRIVÉE</button>
                <button id="btnDepart" class="btn-warning" disabled>❌ DÉPART</button>
            </div>
            
            <button id="btnReset" class="btn-danger">🔄 Réinitialiser</button>
        </div>

        <div class="admin-link">
            <button id="btnAdmin" class="admin-btn">⚙️ Administration</button>
        </div>
    </div>

    <script type="module">
        import { auth, db, storage, employes, sites } from './firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { collection, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

        // Variables
        let currentEmployee = null;
        let currentPhoto = null;
        let currentLocation = null;
        let videoStream = null;
        let gpsOk = false;
        let photoOk = false;

        // DOM
        const matriculeInput = document.getElementById('matricule');
        const employeeInfo = document.getElementById('employeeInfo');
        const lieuSelect = document.getElementById('lieu');
        const gpsStatus = document.getElementById('gpsStatus');
        const gpsCoords = document.getElementById('gpsCoords');
        const btnGps = document.getElementById('btnGps');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photoPreview');
        const btnCamera = document.getElementById('btnCamera');
        const btnPhoto = document.getElementById('btnPhoto');
        const btnArrivee = document.getElementById('btnArrivee');
        const btnDepart = document.getElementById('btnDepart');
        const btnReset = document.getElementById('btnReset');
        const btnAdmin = document.getElementById('btnAdmin');

        // Minuteur
        function updateTimer() {
            document.getElementById('timer').textContent = new Date().toLocaleTimeString('fr-FR');
        }
        updateTimer();
        setInterval(updateTimer, 1000);

        // Message
        function showMessage(msg, isError = false) {
            const div = document.createElement('div');
            div.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;color:white;z-index:9999;font-weight:bold;background:${isError ? '#dc3545' : '#28a745'};`;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // Vérifier si tout est prêt
        function checkReady() {
            const lieuOk = lieuSelect.value !== "";
            const ready = (currentEmployee && photoOk && gpsOk && lieuOk);
            btnArrivee.disabled = !ready;
            btnDepart.disabled = !ready;
        }

        // 1. MATRICULE
        matriculeInput.addEventListener('input', function() {
            const mat = this.value.trim().toUpperCase();
            if (employes[mat]) {
                currentEmployee = { matricule: mat, name: employes[mat] };
                employeeInfo.innerHTML = `<div class="employee-card"><div class="employee-name">👤 ${currentEmployee.name}</div><div>${currentEmployee.matricule}</div></div>`;
                showMessage(`Bonjour ${currentEmployee.name}`);
            } else if (mat.length >= 3) {
                currentEmployee = null;
                employeeInfo.innerHTML = '<div class="employee-card" style="background:#dc3545;">❌ Matricule invalide</div>';
            } else {
                currentEmployee = null;
                employeeInfo.innerHTML = '';
            }
            checkReady();
        });

        // 2. GPS
        function calculerDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        btnGps.addEventListener('click', () => {
            if (!navigator.geolocation) {
                showMessage("GPS non supporté", true);
                return;
            }
            gpsStatus.textContent = "Recherche...";
            gpsStatus.className = "status-warning";
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    gpsStatus.textContent = "✅ GPS actif";
                    gpsStatus.className = "status-success";
                    gpsCoords.innerHTML = `${currentLocation.lat.toFixed(4)}°, ${currentLocation.lng.toFixed(4)}°`;
                    
                    if (lieuSelect.value) {
                        const site = sites[lieuSelect.value];
                        if (site) {
                            const distance = calculerDistance(currentLocation.lat, currentLocation.lng, site.lat, site.lng);
                            if (distance <= site.radius) {
                                gpsOk = true;
                                gpsStatus.textContent = "✅ Dans la zone";
                                showMessage(`Vous êtes dans la zone (${Math.round(distance)}m)`);
                            } else {
                                gpsOk = false;
                                gpsStatus.textContent = "❌ Hors zone";
                                gpsStatus.className = "status-error";
                                showMessage(`Vous êtes à ${Math.round(distance)}m du site`, true);
                            }
                        }
                    } else {
                        gpsOk = true;
                    }
                    checkReady();
                },
                (err) => {
                    gpsOk = false;
                    gpsStatus.textContent = "❌ GPS refusé";
                    gpsStatus.className = "status-error";
                    showMessage("Autorisez la géolocalisation", true);
                }
            );
        });

        lieuSelect.addEventListener('change', () => {
            if (currentLocation && lieuSelect.value) {
                const site = sites[lieuSelect.value];
                if (site) {
                    const distance = calculerDistance(currentLocation.lat, currentLocation.lng, site.lat, site.lng);
                    if (distance <= site.radius) {
                        gpsOk = true;
                        gpsStatus.textContent = "✅ Dans la zone";
                        gpsStatus.className = "status-success";
                    } else {
                        gpsOk = false;
                        gpsStatus.textContent = "❌ Hors zone";
                        gpsStatus.className = "status-error";
                    }
                }
            }
            checkReady();
        });

        // 3. CAMERA & PHOTO
        btnCamera.addEventListener('click', async () => {
            try {
                if (videoStream) videoStream.getTracks().forEach(t => t.stop());
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = videoStream;
                video.style.display = "block";
                btnPhoto.disabled = false;
                btnCamera.textContent = "✅ Caméra active";
                showMessage("Caméra prête");
            } catch (err) {
                showMessage("Impossible d'accéder à la caméra", true);
            }
        });

        btnPhoto.addEventListener('click', () => {
            if (!videoStream) {
                showMessage("Activez d'abord la caméra", true);
                return;
            }
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            ctx.restore();
            
            currentPhoto = canvas.toDataURL('image/jpeg', 0.8);
            const img = document.createElement('img');
            img.src = currentPhoto;
            img.style.width = "100%";
            img.style.borderRadius = "10px";
            photoPreview.innerHTML = "";
            photoPreview.appendChild(img);
            
            photoOk = true;
            btnPhoto.disabled = true;
            btnPhoto.textContent = "✅ Photo prise";
            
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
                video.style.display = "none";
            }
            showMessage("Selfie enregistré");
            checkReady();
        });

        // 4. POINTAGE
        async function savePointage(type) {
            if (!checkReady()) {
                showMessage("Complétez tous les champs", true);
                return;
            }
            
            btnArrivee.disabled = true;
            btnDepart.disabled = true;
            
            try {
                const siteName = lieuSelect.options[lieuSelect.selectedIndex].text;
                const photoRef = ref(storage, `pointages/${Date.now()}_${currentEmployee.matricule}.jpg`);
                await uploadString(photoRef, currentPhoto, 'data_url');
                const photoURL = await getDownloadURL(photoRef);
                
                await addDoc(collection(db, "pointages"), {
                    matricule: currentEmployee.matricule,
                    nom: currentEmployee.name,
                    lieu: lieuSelect.value,
                    lieuName: siteName,
                    type: type,
                    photoURL: photoURL,
                    location: currentLocation,
                    timestamp: Timestamp.now(),
                    date: new Date().toISOString().split('T')[0],
                    heure: new Date().toLocaleTimeString('fr-FR')
                });
                
                showMessage(`✅ ${type} enregistrée à ${new Date().toLocaleTimeString('fr-FR')}`);
                resetAll();
            } catch (error) {
                console.error(error);
                showMessage("Erreur d'enregistrement", true);
                btnArrivee.disabled = false;
                btnDepart.disabled = false;
            }
        }

        btnArrivee.addEventListener('click', () => savePointage("Arrivée"));
        btnDepart.addEventListener('click', () => savePointage("Départ"));

        // 5. RÉINITIALISATION
        function resetAll() {
            currentEmployee = null;
            currentPhoto = null;
            currentLocation = null;
            photoOk = false;
            gpsOk = false;
            matriculeInput.value = "";
            lieuSelect.value = "";
            employeeInfo.innerHTML = "";
            gpsStatus.textContent = "Non activé";
            gpsStatus.className = "";
            gpsCoords.innerHTML = "";
            photoPreview.innerHTML = "";
            btnCamera.textContent = "🎥 Activer caméra";
            btnPhoto.disabled = true;
            btnPhoto.textContent = "📷 Prendre la photo";
            video.style.display = "none";
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            checkReady();
            showMessage("Formulaire réinitialisé");
        }

        btnReset.addEventListener('click', resetAll);

        // 6. ADMIN
        btnAdmin.addEventListener('click', () => {
            const email = prompt("Email admin:");
            if (!email) return;
            const pwd = prompt("Mot de passe:");
            signInWithEmailAndPassword(auth, email, pwd)
                .then(() => window.location.href = "admin.html")
                .catch(() => showMessage("Identifiants incorrects", true));
        });

        console.log("✅ Application prête");
    </script>
</body>
</html>
