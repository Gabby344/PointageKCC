<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCC Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: #003366;
            color: white;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #003366;
        }
        .filters {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filters input, .filters select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            background: #003366;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        table {
            width: 100%;
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }
        th {
            background: #003366;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        .badge-success {
            background: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        .badge-warning {
            background: #ffc107;
            color: #333;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        .thumbnail {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }
        .logout {
            background: #dc3545;
        }
        @media (max-width: 700px) {
            th, td { font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Administration KCC</h1>
            <button class="logout" onclick="logout()">Déconnexion</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalToday">0</div>
                <div>Pointages aujourd'hui</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="arriveesToday">0</div>
                <div>Arrivées</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="departsToday">0</div>
                <div>Départs</div>
            </div>
        </div>

        <div class="filters">
            <input type="date" id="filterDate">
            <select id="filterSite">
                <option value="">Tous les sites</option>
                <option value="Batiments_la_Vision">Bâtiments la Vision</option>
                <option value="Hotel_Moon_Palace">Hôtel Moon Palace</option>
                <option value="Hotel_Kolwezi_Lodge">Hotel Kolwezi Lodge</option>
                <option value="Direction_KCC">Direction KCC</option>
            </select>
            <button onclick="loadData()">Filtrer</button>
            <button onclick="exportCSV()">Exporter CSV</button>
        </div>

        <div style="overflow-x: auto;">
            <table id="table">
                <thead>
                    <tr>
                        <th>Employé</th>
                        <th>Matricule</th>
                        <th>Lieu</th>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Heure</th>
                        <th>Photo</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" style="text-align:center;">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkCnxIDdzngjnltxC9IBCV1Fk2JYSrKM0",
            authDomain: "pointage-app-42339.firebaseapp.com",
            projectId: "pointage-app-42339",
            storageBucket: "pointage-app-42339.firebasestorage.app",
            appId: "1:63257821944:web:e8e06472eacee7675eb10d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allData = [];

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                loadData();
                setInterval(loadData, 30000);
            }
        });

        async function loadData() {
            const q = query(collection(db, "pointages"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            allData = [];
            snapshot.forEach(doc => allData.push(doc.data()));
            displayTable();
            updateStats();
        }

        function displayTable() {
            const date = document.getElementById('filterDate').value;
            const site = document.getElementById('filterSite').value;
            
            let filtered = allData.filter(p => {
                if (date && p.date !== date) return false;
                if (site && p.lieu !== site) return false;
                return true;
            });
            
            const tbody = document.getElementById('tableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">Aucun pointage</td></tr>';
                return;
            }
            
            tbody.innerHTML = filtered.map(p => `
                <tr>
                    <td>${p.nom || '-'}</td>
                    <td>${p.matricule || '-'}</td>
                    <td>${p.lieuName || p.lieu || '-'}</td>
                    <td><span class="${p.type === 'Arrivée' ? 'badge-success' : 'badge-warning'}">${p.type}</span></td>
                    <td>${p.date || '-'}</td>
                    <td>${p.heure || '-'}</td>
                    <td>${p.photoURL ? `<img src="${p.photoURL}" class="thumbnail" onclick="window.open('${p.photoURL}')">` : '-'}</td>
                </tr>
            `).join('');
        }

        function updateStats() {
            const today = new Date().toISOString().split('T')[0];
            const todayData = allData.filter(p => p.date === today);
            document.getElementById('totalToday').textContent = todayData.length;
            document.getElementById('arriveesToday').textContent = todayData.filter(p => p.type === 'Arrivée').length;
            document.getElementById('departsToday').textContent = todayData.filter(p => p.type === 'Départ').length;
        }

        function exportCSV() {
            const headers = ['Nom', 'Matricule', 'Lieu', 'Type', 'Date', 'Heure', 'Latitude', 'Longitude'];
            const rows = allData.map(p => [p.nom, p.matricule, p.lieuName, p.type, p.date, p.heure, p.location?.lat || '', p.location?.lng || '']);
            const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `pointages_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        window.logout = async () => {
            await signOut(auth);
            window.location.href = 'index.html';
        };
        
        window.loadData = loadData;
        window.exportCSV = exportCSV;
    </script>
</body>
</html>
